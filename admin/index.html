<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>表单后台管理</title>
<style>
  :root {
    --bg: #f4f6f8;
    --card: #ffffff;
    --ink: #1a1f36;
    --ink-2: #5b6372;
    --ink-3: #9aa1ae;
    --line: #06C755;
    --line-dark: #00B84A;
    --border: #e9edf2;
    --shadow: 0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.06);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--ink); min-height: 100vh; -webkit-font-smoothing: antialiased;
  }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--line); color: #fff; border: none; border-radius: 10px;
    padding: 11px 18px; font-size: .9rem; font-weight: 600; cursor: pointer;
    transition: background .15s, transform .05s;
  }
  .btn:hover { background: var(--line-dark); }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .6; cursor: not-allowed; }
  .btn.ghost { background: #eef1f4; color: var(--ink-2); }
  .btn.ghost:hover { background: #e4e8ec; }
  .btn.block { width: 100%; }

  /* ---------- 登录页 ---------- */
  .login-page {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
    background:
      radial-gradient(1100px 560px at 18% -10%, #e7fbe9, transparent),
      radial-gradient(900px 480px at 100% 0%, #e3f1ff, transparent),
      var(--bg);
  }
  .login-card {
    width: 100%; max-width: 400px; background: var(--card); border: 1px solid var(--border);
    border-radius: 18px; box-shadow: var(--shadow); padding: 40px 32px;
  }
  .login-logo {
    width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 18px;
    background: linear-gradient(135deg, #06C755, #00B84A);
    display: flex; align-items: center; justify-content: center; font-size: 26px;
    box-shadow: 0 8px 20px rgba(6,199,85,.28);
  }
  .login-card h1 { font-size: 1.4rem; text-align: center; margin-bottom: 6px; }
  .login-card .sub { text-align: center; color: var(--ink-2); font-size: .88rem; margin-bottom: 28px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: .82rem; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px;
    font-size: .95rem; background: #fbfcfe; color: var(--ink); transition: border-color .15s, box-shadow .15s;
  }
  .field input:focus { outline: none; border-color: var(--line); box-shadow: 0 0 0 3px rgba(6,199,85,.14); background: #fff; }
  .err { color: #e05a4a; font-size: .84rem; margin-top: 12px; min-height: 1.2em; text-align: center; }

  /* ---------- 后台 ---------- */
  .app { max-width: 1080px; margin: 0 auto; padding: 24px 20px 60px; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px 18px; box-shadow: var(--shadow); margin-bottom: 18px;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.05rem; }
  .brand .logo {
    width: 38px; height: 38px; border-radius: 10px; background: linear-gradient(135deg, #06C755, #00B84A);
    display: flex; align-items: center; justify-content: center; font-size: 19px; color: #fff;
  }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 18px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 18px; box-shadow: var(--shadow);
  }
  .stat-label { font-size: .78rem; color: var(--ink-3); font-weight: 600; margin-bottom: 8px; letter-spacing: .02em; }
  .stat-value { font-size: 1.6rem; font-weight: 700; line-height: 1.1; }
  .stat-value small { font-size: .85rem; font-weight: 600; color: var(--ink-3); margin-left: 3px; }
  .stat-value.text { font-size: .95rem; font-weight: 600; color: var(--ink); line-height: 1.5; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); margin-bottom: 18px; }
  .filters { display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap; padding: 20px; }
  .f-group { min-width: 170px; }
  .f-group label { display: block; font-size: .78rem; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; }
  .f-group input {
    width: 100%; padding: 11px 13px; border: 1px solid var(--border); border-radius: 10px;
    font-size: .92rem; background: #fbfcfe; color: var(--ink);
  }
  .f-group input:focus { outline: none; border-color: var(--line); box-shadow: 0 0 0 3px rgba(6,199,85,.14); background: #fff; }
  .quick { display: flex; gap: 8px; align-items: center; margin-bottom: 1px; }
  .chip {
    padding: 9px 14px; border: 1px solid var(--border); background: #fff; color: var(--ink-2);
    border-radius: 999px; font-size: .82rem; font-weight: 600; cursor: pointer; transition: all .15s;
  }
  .chip:hover { border-color: var(--line); color: var(--line-dark); }
  .chip.active { background: var(--line); border-color: var(--line); color: #fff; }

  .table-head { padding: 18px 20px 0; font-weight: 700; font-size: 1rem; }
  .table-wrap { padding: 14px 20px 20px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .87rem; min-width: 640px; }
  th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--ink-3); font-weight: 600; font-size: .76rem; letter-spacing: .02em; }
  tbody tr { transition: background .12s; }
  tbody tr:hover { background: #f6faf7; }
  tbody tr:last-child td { border-bottom: none; }
  .empty { text-align: center; color: var(--ink-3); padding: 40px; display: none; font-size: .9rem; }

  @media (max-width: 640px) {
    .stats { grid-template-columns: 1fr; }
    .filters { flex-direction: column; align-items: stretch; }
    .f-group { min-width: 0; }
  }
</style>
</head>
<body>
  <!-- 登录 -->
  <div class="login-page" id="loginView">
    <div class="login-card">
      <div class="login-logo">📊</div>
      <h1>表单后台</h1>
      <p class="sub">请登录以查看提交数据</p>
      <div class="field">
        <label>账号</label>
        <input type="text" id="username" autocomplete="username" placeholder="请输入账号" />
      </div>
      <div class="field">
        <label>密码</label>
        <input type="password" id="password" autocomplete="current-password" placeholder="请输入密码" />
      </div>
      <button class="btn block" id="loginBtn">登录</button>
      <div class="err" id="loginError"></div>
    </div>
  </div>

  <!-- 后台 -->
  <div class="app" id="adminView" style="display:none">
    <header class="topbar">
      <div class="brand"><span class="logo">📊</span> 表单查询后台</div>
      <button class="btn ghost" id="logoutBtn">退出登录</button>
    </header>

    <div class="stats">
      <div class="stat-card">
        <div class="stat-label">本次查询结果</div>
        <div class="stat-value" id="statCount">0<small>条</small></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">时间范围</div>
        <div class="stat-value text" id="statRange">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">最新提交</div>
        <div class="stat-value text" id="statLatest">—</div>
      </div>
    </div>

    <div class="card">
      <div class="filters">
        <div class="f-group">
          <label>开始日期</label>
          <input type="date" id="fromDate" />
        </div>
        <div class="f-group">
          <label>结束日期</label>
          <input type="date" id="toDate" />
        </div>
        <div class="quick">
          <button class="chip" data-days="3">近 3 天</button>
          <button class="chip" data-days="7">近 7 天</button>
          <button class="chip" data-days="30">近 30 天</button>
        </div>
        <button class="btn" id="queryBtn">查询</button>
      </div>
    </div>

    <div class="card">
      <div class="table-head">提交记录</div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>提交时间</th><th>姓名</th><th>年龄</th><th>身高(cm)</th><th>体重(kg)</th><th>使用过产品</th></tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="empty" id="empty">这个时间范围内没有数据</div>
    </div>
  </div>

  <script>
  (function() {
    'use strict';

    // 同域部署（Worker 路由到 gabk77y.site/api/*）留空即可；
    // 若 API 用独立子域，改成 'https://api.gabk77y.site'
    var API_BASE = '';
    var TOKEN_KEY = 'jianfei_admin_token';

    var loginView = document.getElementById('loginView');
    var adminView = document.getElementById('adminView');
    var loginError = document.getElementById('loginError');
    var usernameEl = document.getElementById('username');
    var passwordEl = document.getElementById('password');
    var loginBtn = document.getElementById('loginBtn');
    var logoutBtn = document.getElementById('logoutBtn');
    var queryBtn = document.getElementById('queryBtn');
    var fromDate = document.getElementById('fromDate');
    var toDate = document.getElementById('toDate');
    var tbody = document.getElementById('tbody');
    var empty = document.getElementById('empty');
    var statCount = document.getElementById('statCount');
    var statRange = document.getElementById('statRange');
    var statLatest = document.getElementById('statLatest');

    function getToken() { return localStorage.getItem(TOKEN_KEY); }
    function setToken(t) { localStorage.setItem(TOKEN_KEY, t); }
    function clearToken() { localStorage.removeItem(TOKEN_KEY); }

    function pad(n) { return String(n).padStart(2, '0'); }
    function fmtDate(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
    function dateToMs(str, endOfDay) {
      if (!str) return null;
      var t = endOfDay ? (str + 'T23:59:59.999') : (str + 'T00:00:00');
      return new Date(t).getTime();
    }
    function fmtTime(ms) {
      var d = new Date(ms);
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    }
    function setDefaultRange() {
      var now = new Date();
      fromDate.value = fmtDate(new Date(now.getTime() - 3 * 24 * 60 * 60 * 1000));
      toDate.value = fmtDate(now);
    }
    function showLogin() { loginView.style.display = 'flex'; adminView.style.display = 'none'; }
    function showAdmin() { loginView.style.display = 'none'; adminView.style.display = 'block'; }
    function esc(s) { return s == null ? '' : String(s); }

    function render(list) {
      tbody.innerHTML = '';
      if (!list || list.length === 0) {
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';
      list.forEach(function(r) {
        var tr = document.createElement('tr');
        var vals = [fmtTime(r.created_at), esc(r.name), esc(r.age), esc(r.height), esc(r.weight), esc(r.used_product)];
        vals.forEach(function(v) {
          var td = document.createElement('td');
          td.textContent = v;
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
    }

    function updateStats(list, from, to) {
      statCount.innerHTML = (list ? list.length : 0) + '<small>条</small>';
      statRange.textContent = fmtDate(new Date(from)) + ' ~ ' + fmtDate(new Date(to));
      statLatest.textContent = (list && list.length) ? fmtTime(list[0].created_at) : '—';
    }

    function loadData() {
      var from = dateToMs(fromDate.value, false) || (Date.now() - 3 * 24 * 60 * 60 * 1000);
      var to = dateToMs(toDate.value, true) || Date.now();
      var token = getToken();
      fetch(API_BASE + '/api/submissions?from=' + from + '&to=' + to, {
        headers: { 'Authorization': 'Bearer ' + token }
      }).then(function(res) {
        if (res.status === 401) { clearToken(); showLogin(); throw new Error('unauth'); }
        return res.json();
      }).then(function(data) {
        render(data.results);
        updateStats(data.results, from, to);
      }).catch(function(e) {
        if (e.message !== 'unauth') render([]);
      });
    }

    function checkLogin() {
      if (!getToken()) { showLogin(); return; }
      showAdmin();
      loadData();
    }

    loginBtn.addEventListener('click', function() {
      if (!usernameEl.value || !passwordEl.value) { loginError.textContent = '请输入账号与密码'; return; }
      loginError.textContent = '';
      loginBtn.disabled = true;
      loginBtn.textContent = '登录中…';
      fetch(API_BASE + '/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: usernameEl.value, password: passwordEl.value })
      }).then(function(res) { return res.json(); }).then(function(d) {
        loginBtn.disabled = false;
        loginBtn.textContent = '登录';
        if (d.ok && d.token) {
          setToken(d.token);
          showAdmin();
          loadData();
        } else {
          loginError.textContent = d.error || '账号或密码错误';
        }
      }).catch(function() {
        loginBtn.disabled = false;
        loginBtn.textContent = '登录';
        loginError.textContent = '登录失败，请稍后再试';
      });
    });

    passwordEl.addEventListener('keydown', function(e) { if (e.key === 'Enter') loginBtn.click(); });
    logoutBtn.addEventListener('click', function() {
      clearToken();
      showLogin();
    });
    queryBtn.addEventListener('click', loadData);

    var chips = document.querySelectorAll('.chip');
    chips.forEach(function(c) {
      c.addEventListener('click', function() {
        chips.forEach(function(x) { x.classList.remove('active'); });
        c.classList.add('active');
        var days = parseInt(c.getAttribute('data-days'), 10);
        var now = new Date();
        toDate.value = fmtDate(now);
        fromDate.value = fmtDate(new Date(now.getTime() - days * 24 * 60 * 60 * 1000));
        loadData();
      });
    });

    setDefaultRange();
    document.querySelector('.chip[data-days="3"]').classList.add('active');
    checkLogin();
  })();
  </script>
</body>
</html>
